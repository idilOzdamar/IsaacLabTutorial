services:
  isaac-lab-base:
    environment:
      - MY_CUSTOM_ENV=1
    volumes:
      - type: bind
        source: ~/workspaces/isaac_lab_tutorial
        target: /workspace/isaac_lab_tutorial
      - type: bind
        source: ~/workspaces/push_docker_ws
        target: /workspace/push_docker_ws
      - type: bind
        source: ~/workspaces/push_ws
        target: /workspace/push_ws
      - type: bind
        source: ~/workspaces/mushr-master
        target: /workspace/mushr-master
    working_dir: /workspace/isaac_lab_tutorial
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    
  isaac-lab-ros2:
    environment:
      - MY_CUSTOM_ENV=1
    volumes:
      - type: bind
        source: ~/workspaces/isaac_lab_tutorial
        target: /workspace/isaac_lab_tutorial
      - type: bind
        source: ~/workspaces/push_docker_ws
        target: /workspace/push_docker_ws
      - type: bind
        source: ~/workspaces/push_ws
        target: /workspace/push_ws
    working_dir: /workspace/isaac_lab_tutorial
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia

